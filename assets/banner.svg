<text x="600" y="198" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="0.4" fill="#a8b3c4">Moor — desired-state control plane for docker-compose.</text>
<text x="600" y="224" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="0.4" fill="#a8b3c4">Kubernetes-style drift detection and auto-remediation for the stacks everyone runs.</text>

<g transform="translate(600,308)">

<text x="-440" y="-64" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#7d8590">declared (compose)</text>
